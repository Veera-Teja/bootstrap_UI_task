<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | KeshavSoft</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-hexagon-fill"></i> KeshavSoft
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav gap-3 align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contact Form Section -->
  <section class="hero-section">
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card card-custom p-4 p-md-5">
            <div class="text-center mb-4">
              <h2 class="fw-bold mb-2">Get in Touch</h2>
              <p class="text-muted">Fill out the form below to send an inquiry (Demo Interface)</p>
            </div>
            
            <form id="contactForm" novalidate>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="fullName" class="form-label text-muted small fw-semibold">Your Name</label>
                  <input type="text" class="form-control" id="fullName" placeholder="John Doe" required>
                </div>
                <div class="col-md-6">
                  <label for="emailAddr" class="form-label text-muted small fw-semibold">Email Address</label>
                  <input type="email" class="form-control" id="emailAddr" placeholder="john@example.com" required>
                </div>
              </div>
              <div class="mb-3">
                <label for="subject" class="form-label text-muted small fw-semibold">Subject</label>
                <input type="text" class="form-control" id="subject" placeholder="Project Discussion" required>
              </div>
              <div class="mb-4">
                <label for="message" class="form-label text-muted small fw-semibold">Message</label>
                <textarea class="form-control" id="message" rows="4" placeholder="Write your message here..." required></textarea>
              </div>
              <button type="submit" class="btn btn-glow w-100 py-3">Send Message</button>
            </form>

            <div id="formAlert" class="alert alert-success mt-4 d-none text-center" role="alert">
              Thank you! Your message has been simulated successfully.
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="py-4 text-center">
    <div class="container">
      <p class="mb-0 text-muted">&copy; <span id="year"></span> KeshavSoft. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const alertBox = document.getElementById('formAlert');
      alertBox.classList.remove('d-none');
      this.reset();
    });
  </script>
</body>
</html>
