<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — KeshavSoft</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">KeshavSoft</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu3">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu3">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<section style="margin-top:80px;" class="py-5">
  <div class="container">
    <h2 class="section-title">Get in touch</h2>
    <div class="row">
      <div class="col-md-6">
        <div class="contact-card">
          <h5>Contact Details</h5>
          <p class="text-muted">Email: contact@keshavsoft.com<br>Location: Kakinada, India</p>
          <p class="text-muted">Openings: 4 Developers | 3 LPA | Work From Home</p>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card contact-card">
          <form id="contactForm" class="mt-2">
            <div class="mb-3">
              <label class="form-label">Full name</label>
              <input type="text" class="form-control" id="name" placeholder="Your full name" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" id="message" rows="4" placeholder="Tell us about your interest" required></textarea>
            </div>
            <button class="btn btn-primary-custom w-100" type="submit">Send Message</button>
            <div id="formAlert" class="mt-3" style="display:none"></div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer mt-5">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
    <div>© 2025 KeshavSoft</div>
    <div class="mt-2 mt-md-0">Made with <span style="color:var(--brand-orange)">❤</span> in Kakinada</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('contactForm').addEventListener('submit', function(e){
  e.preventDefault();
  const alertBox = document.getElementById('formAlert');
  alertBox.style.display = 'block';
  alertBox.innerHTML = '<div class="alert alert-success">Thanks! Your message has been recorded (demo).</div>';
  this.reset();
  setTimeout(()=> alertBox.style.display='none', 4000);
});
</script>
</body>
</html>
